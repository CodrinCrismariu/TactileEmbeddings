[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tactilelatent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.7.1", "transformers>=4.56", "numpy", "h5py", "pillow", "av", "pyarrow", "zarr>=2.18,<3"]

[project.optional-dependencies]
test = ["pytest"]
monitor = ["tensorboard"]
alignment = ["POT==0.9.6.post1"]
video = ["timm==1.0.22", "einops==0.8.1"]
acquisition = ["gdown==5.2.0", "httpx>=0.28,<1", "huggingface-hub>=0.34,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tactilelatent = ["autoencoder_viewer.html", "attention_viewer.js", "pressure_surface_viewer.js", "opentouch_hand_layout.json", "training_dashboard.html", "training_dashboard.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

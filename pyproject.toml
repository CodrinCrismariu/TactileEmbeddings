[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tactilelatent"
version = "0.2.0"
description = "Video-to-touch research core and explicit operational commands"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7.1",
    "transformers>=4.56",
    "numpy",
    "h5py",
    "pillow",
    "av",
    "pyarrow",
    "zarr>=2.18,<3",
]

[project.scripts]
tl = "tactilelatent_tools.cli:main"

[project.optional-dependencies]
test = ["pytest"]
dev = [
    "pytest",
    "ruff==0.17.1",
    "jsbeautifier==2.0.3",
    "cssbeautifier==2.0.3",
    "djlint==1.46.6",
]
monitor = ["tensorboard"]
video = ["timm==1.0.22", "einops==0.8.1"]
acquisition = ["gdown==5.2.0", "httpx>=0.28,<1", "huggingface-hub>=0.34,<2"]

[tool.setuptools.packages.find]
where = ["src", "tools"]
include = ["tactilelatent", "tactilelatent.*", "tactilelatent_tools", "tactilelatent_tools.*"]

[tool.setuptools.package-data]
"tactilelatent.visualization" = ["*.html", "*.js", "*.css", "*.json", "assets/*"]
"tactilelatent.datasets" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tools"]
include = ["src/**/*.py", "tools/**/*.py", "tests/**/*.py", "examples/**/*.py"]
extend-exclude = [
    "legacy/**",
    "ai_work/**",
    "datasets/**",
    "processing/**",
    "mano_models/**",
    ".venv/**",
]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.djlint]
profile = "html"
indent = 2
max_line_length = 100
max_attribute_length = 70
format_css = true
format_js = true
indent_css = 2
indent_js = 2
ignore_case = true
no_entity_formatting = true
